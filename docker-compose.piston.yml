version: '3.8'

services:
  # ----------------------------------------------------
  # 1. Code-Sync Application Server
  # ----------------------------------------------------
  code-sync:
    build: .
    container_name: code-sync-app
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - PISTON_API_URL=http://piston:2000/api/v2/execute
      - ENABLE_LOCAL_EXECUTION=true
    depends_on:
      - piston
    restart: unless-stopped

  # ----------------------------------------------------
  # 2. Piston Sandbox Engine (Ultra-Lightweight, No DB)
  # ----------------------------------------------------
  piston:
    image: ghcr.io/engineer-man/piston
    container_name: piston-server
    ports:
      - "2000:2000"
    privileged: true
    restart: unless-stopped
