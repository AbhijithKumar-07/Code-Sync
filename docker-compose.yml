version: '3.8'

services:
  # ----------------------------------------------------
  # 1. Code-Sync Main Application Server
  # ----------------------------------------------------
  code-sync:
    build: .
    container_name: code-sync-app
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - JUDGE0_API_URL=http://judge0-server:2358
      - ENABLE_LOCAL_EXECUTION=true
    depends_on:
      - judge0-server
    restart: unless-stopped

  # ----------------------------------------------------
  # 2. Judge0 CE Code Execution API Server
  # ----------------------------------------------------
  judge0-server:
    image: judge0/judge0:1.13.0
    container_name: judge0-server
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    ports:
      - "2358:2358"
    privileged: true
    environment:
      - REDIS_HOST=judge0-redis
      - POSTGRES_HOST=judge0-db
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=judge0password
      - POSTGRES_DB=judge0
    depends_on:
      - judge0-db
      - judge0-redis
    restart: unless-stopped

  # ----------------------------------------------------
  # 3. Judge0 Workers (Multi-Core Sandboxed Compilers)
  # ----------------------------------------------------
  judge0-workers:
    image: judge0/judge0:1.13.0
    container_name: judge0-workers
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    privileged: true
    environment:
      - REDIS_HOST=judge0-redis
      - POSTGRES_HOST=judge0-db
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=judge0password
      - POSTGRES_DB=judge0
    depends_on:
      - judge0-server
    restart: unless-stopped

  # ----------------------------------------------------
  # 4. Redis Cache & Queue for Submissions
  # ----------------------------------------------------
  judge0-redis:
    image: redis:7.2-alpine
    container_name: judge0-redis
    restart: unless-stopped

  # ----------------------------------------------------
  # 5. Postgres Database for Submissions & Languages
  # ----------------------------------------------------
  judge0-db:
    image: postgres:16-alpine
    container_name: judge0-db
    environment:
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=judge0password
      - POSTGRES_DB=judge0
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres-data:
